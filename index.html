<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>石灰散布記録</title>
<style>
/* ========== リセット・変数 ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body { font-family: 'Hiragino Kaku Gothic ProN','Meiryo','Yu Gothic',sans-serif;
       background: #f4f5f0; color: #1c2a1a; min-height: 100vh; }

:root {
  --green-dk:  #2d5a27;
  --green-mid: #4a7c43;
  --green-lt:  #d8e8d4;
  --accent:    #e8f0e6;
  --bg:        #f4f5f0;
  --surface:   #ffffff;
  --border:    #c8d4c4;
  --text:      #1c2a1a;
  --sub:       #5a6e56;
  --danger:    #c0392b;
  --warn-bg:   #fff3cd;
  --warn-bdr:  #f0ad4e;
  --radius:    10px;
  --shadow:    0 2px 8px rgba(0,0,0,.10);
  --max-w:     540px;
}

/* ========== ヘッダー ========== */
.hd {
  background: #f0f2ef;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 6px rgba(0,0,0,.10);
}
.hd-row1 {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 8px 16px 4px;
}
.hd-logo { height: 26px; width: auto; display: block; }
.hd-row2 {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 14px 8px;
  gap: 8px;
}
.hd-icon { font-size: 20px; }
.hd-title { font-size: 15px; font-weight: 700; color: var(--green-dk); }

/* ========== タブ ========== */
.tab-bar {
  display: flex;
  background: var(--surface);
  border-bottom: 2px solid var(--green-lt);
  position: sticky;
  top: 70px;
  z-index: 99;
}
.tab-btn {
  flex: 1;
  padding: 12px 6px;
  font-size: 13px;
  font-weight: 600;
  text-align: center;
  border: none;
  background: none;
  color: var(--sub);
  cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: color .2s, border-color .2s;
}
.tab-btn.active {
  color: var(--green-dk);
  border-bottom-color: var(--green-dk);
}

/* ========== コンテンツ共通 ========== */
.tab-content { display: none; padding: 16px; max-width: var(--max-w); margin: 0 auto; }
.tab-content.active { display: block; }

/* ========== カード ========== */
.card {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
  margin-bottom: 14px;
}
.card-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--sub);
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: .04em;
}

/* ========== フォーム要素 ========== */
label { display: block; font-size: 13px; font-weight: 600; color: var(--sub); margin-bottom: 4px; }
input[type=date], input[type=text], select, textarea {
  display: block;
  width: 100%;
  padding: 12px 14px;
  font-size: 16px;
  font-family: inherit;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: var(--text);
  -webkit-appearance: none;
  appearance: none;
  outline: none;
  transition: border-color .2s;
}
input[type=date]:focus, input[type=text]:focus, select:focus, textarea:focus {
  border-color: var(--green-mid);
}
textarea { resize: vertical; min-height: 72px; font-size: 15px; }
.form-group { margin-bottom: 14px; }

/* ========== ボタン ========== */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 13px 20px; font-size: 15px; font-weight: 700;
  border: none; border-radius: 8px; cursor: pointer;
  transition: opacity .15s, transform .1s;
  -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: scale(.97); opacity: .85; }
.btn-primary { background: var(--green-dk); color: #fff; width: 100%; }
.btn-secondary { background: var(--green-lt); color: var(--green-dk); }
.btn-danger   { background: #fdecea; color: var(--danger); }
.btn-sm { padding: 8px 14px; font-size: 13px; }

/* ========== 記録リスト ========== */
.month-nav {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.month-nav .month-label {
  font-size: 17px; font-weight: 700; color: var(--green-dk);
}
.month-nav .btn { background: var(--green-lt); color: var(--green-dk); padding: 10px 16px; font-size: 18px; }

.rec-item {
  display: flex; align-items: flex-start;
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 12px 14px;
  margin-bottom: 10px;
  gap: 12px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: box-shadow .15s;
}
.rec-item:active { box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.rec-date-box {
  min-width: 52px; text-align: center;
  background: var(--green-lt);
  border-radius: 8px;
  padding: 6px 4px;
}
.rec-date-day { font-size: 22px; font-weight: 800; color: var(--green-dk); line-height: 1; }
.rec-date-dow { font-size: 11px; color: var(--sub); margin-top: 2px; }
.rec-date-dow.sat { color: #1a237e; }
.rec-date-dow.sun { color: var(--danger); }
.rec-body { flex: 1; min-width: 0; }
.rec-dept { font-size: 15px; font-weight: 700; color: var(--text); }
.rec-staff { font-size: 13px; color: var(--sub); margin-top: 2px; }
.rec-note { font-size: 12px; color: var(--sub); margin-top: 4px; white-space: pre-wrap; }
.no-records { text-align: center; padding: 40px 16px; color: var(--sub); font-size: 14px; }

/* ========== 出力セクション ========== */
.export-month-nav {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--surface);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.export-month-label { font-size: 17px; font-weight: 700; color: var(--green-dk); }
.export-btn-row { display: flex; gap: 8px; flex-direction: column; }
.export-btn-row .btn { width: 100%; font-size: 15px; padding: 14px; }
.btn-pdf   { background: #c0392b; color: #fff; }
.btn-csv   { background: #27ae60; color: #fff; }

/* ========== 設定タブ ========== */
.setting-section { margin-bottom: 20px; }
.setting-section h3 { font-size: 14px; font-weight: 700; color: var(--sub); margin-bottom: 10px; }
.setting-list { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.setting-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 16px;
  border-bottom: 1px solid var(--green-lt);
}
.setting-item:last-child { border-bottom: none; }
.setting-item span { font-size: 15px; font-weight: 600; }
.setting-add {
  display: flex; gap: 8px; margin-top: 10px;
}
.setting-add input {
  flex: 1; padding: 11px 14px; font-size: 15px;
  border: 1.5px solid var(--border); border-radius: 8px;
  background: var(--bg); color: var(--text); outline: none;
}
.setting-add input:focus { border-color: var(--green-mid); }

/* ========== モーダル ========== */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.45); z-index: 200;
  align-items: flex-end; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface); border-radius: 16px 16px 0 0;
  padding: 20px 16px 32px; width: 100%;
  max-width: var(--max-w);
  max-height: 90vh; overflow-y: auto;
  animation: slideUp .25s ease;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-handle {
  width: 40px; height: 4px; background: var(--border);
  border-radius: 2px; margin: 0 auto 16px;
}
.modal-title {
  font-size: 16px; font-weight: 700; color: var(--green-dk);
  margin-bottom: 16px; text-align: center;
}
.modal-actions { display: flex; gap: 10px; margin-top: 16px; }
.modal-actions .btn { flex: 1; }

/* ========== 警告バナー ========== */
.warn-banner {
  background: var(--warn-bg);
  border: 1.5px solid var(--warn-bdr);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 13px;
  font-weight: 600;
  color: #7d4e00;
  margin-bottom: 14px;
  display: none;
}
.warn-banner.show { display: block; }

/* ========== 実施者 複数プルダウン ========== */
.staff-rows { display: flex; flex-direction: column; gap: 8px; }
.staff-row  { display: flex; align-items: center; gap: 8px; }
.staff-row select { flex: 1; }
.btn-remove-staff {
  flex-shrink: 0;
  width: 36px; height: 44px;
  background: #fdecea; color: var(--danger);
  border: none; border-radius: 8px; font-size: 20px; line-height: 1;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.btn-add-staff-row {
  width: 100%; padding: 10px;
  background: var(--green-lt); color: var(--green-dk);
  border: 1.5px dashed var(--green-mid); border-radius: 8px;
  font-size: 14px; font-weight: 700; cursor: pointer;
  margin-top: 2px;
  -webkit-tap-highlight-color: transparent;
}

/* ========== トースト ========== */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: #1c2a1a; color: #fff; padding: 11px 20px;
  border-radius: 20px; font-size: 14px; font-weight: 600;
  z-index: 300; opacity: 0; transition: opacity .3s;
  pointer-events: none; white-space: nowrap;
}
.toast.show { opacity: 1; }
.toast.error { background: var(--danger); }

/* ========== ローディング ========== */
.loading-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(255,255,255,.6); z-index: 400;
  align-items: center; justify-content: center;
}
.loading-overlay.show { display: flex; }
.spinner {
  width: 36px; height: 36px; border: 3px solid var(--green-lt);
  border-top-color: var(--green-dk); border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ========== 設定バナー ========== */
.config-banner {
  background: #fff3cd; border: 1.5px solid #f0ad4e;
  border-radius: 8px; padding: 12px 14px; margin-bottom: 14px;
  font-size: 13px; color: #7d4e00;
}
.config-banner code {
  background: #f8d7a0; border-radius: 4px;
  padding: 1px 5px; font-size: 12px; font-family: monospace;
}
</style>
</head>
<body>

<!-- ========== ヘッダー ========== -->
<header class="hd">
  <div class="hd-row1">
    <!-- ロゴ画像を使う場合は下の行のコメントを外す -->

  </div>
  <div class="hd-row2">
    <span class="hd-icon">🌿</span>

<!-- ========== タブバー ========== -->
<nav class="tab-bar">

<!-- ========== 記録一覧タブ ========== -->

</div>

<!-- ========== 出力タブ ========== -->
<div class="tab-content" id="tab-export">
  <div class="export-month-nav">
    <button class="btn" id="exp-prev">‹</button>
    <span class="export-month-label" id="exp-month-label">―</span>
    <button class="btn" id="exp-next">›</button>

    <div class="card-title">確認情報</div>

</div>

<!-- ========== 設定タブ ========== -->
<div class="tab-content" id="tab-settings">
  <div class="setting-section">
    <h3>担当部署</h3>
    <div class="setting-list" id="dept-list"></div>
    <div class="setting-add">

</div>

<!-- ========== 訂正モーダル ========== -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">記録の訂正</div>
    <input type="hidden" id="edit-id">
    <div class="form-group">
      <label>実施日</label>
      <input type="date" id="edit-date">
    </div>
    <div class="form-group">
      <label>担当部署</label>
      <select id="edit-dept"></select>
    </div>

      <div id="edit-staff-rows" class="staff-rows"></div>
      <button type="button" class="btn-add-staff-row" onclick="addStaffRow('edit-staff-rows')">＋ 実施者を追加</button>

    <div class="form-group">
      <label>備考</label>
      <textarea id="edit-note"></textarea>

    <div class="modal-actions">
      <button class="btn btn-danger btn-sm" id="btn-edit-delete">削除</button>
      <button class="btn btn-secondary btn-sm" id="btn-edit-cancel">キャンセル</button>

</div>

<!-- ========== 重複確認ダイアログモーダル ========== -->
<div class="modal-overlay" id="dup-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">⚠ 記録済みの確認</div>
    <p style="font-size:14px;color:var(--sub);text-align:center;margin-bottom:16px;">
      同じ日付・担当部署の記録がすでに存在します。<br>上書きしますか？
    </p>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="btn-dup-cancel">キャンセル</button>
      <button class="btn btn-danger"    id="btn-dup-overwrite">上書きする</button>

</div>

<div class="loading-overlay" id="loading"><div class="spinner"></div></div>
<div class="toast" id="toast"></div>

<script>
// ============================================================
//  ★★★ ここを自分のSupabase情報に書き換えてください ★★★
// ============================================================
const SUPABASE_URL    = 'https://eqpbaffvslpxawltrbpc.supabase.co';  // SupabaseプロジェクトURL
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVxcGJhZmZ2c2xweGF3bHRyYnBjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5NjgyMDgsImV4cCI6MjA5NTU0NDIwOH0.47kauTC5Ybot15RRvsKc0cBZcNWfYEc5rYxUbUBo8_8'; // anon公開キー
// ============================================================

// ===== Supabase REST APIヘルパー =====
const SB_HEADERS = {
  'apikey': SUPABASE_ANON_KEY,
  'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
  'Content-Type': 'application/json',
  'Prefer': 'return=representation'
};

async function sbGet(table, params = '') {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${params}`, {
    headers: { ...SB_HEADERS, 'Prefer': 'return=representation' }
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function sbPost(table, body) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
    method: 'POST',
    headers: SB_HEADERS,
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function sbPatch(table, filter, body) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${filter}`, {
    method: 'PATCH',
    headers: SB_HEADERS,
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function sbDelete(table, filter) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${filter}`, {
    method: 'DELETE',
    headers: { ...SB_HEADERS, 'Prefer': '' }
  });
  if (!res.ok) throw new Error(await res.text());
}

// ===== 状態管理 =====
let departments = [];
let staffList   = [];
let records     = [];   // { id, record_date, note, dept_id, dept_name, staff_list:[{id,name}] }
let listYear    = new Date().getFullYear();
let listMonth   = new Date().getMonth() + 1;
let expYear     = listYear;
let expMonth    = listMonth;
let pendingDupId = null;

const dowJa = ['日','月','火','水','木','金','土'];

// ===== ローディング =====
function loading(on) {
  document.getElementById('loading').classList.toggle('show', on);
}

// ===== トースト =====
let toastTimer = null;
function toast(msg, isError = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = 'toast', 2500);
}

// ===== 月表示ラベル =====
function monthLabel(y, m) { return y + '年' + m + '月'; }

// ===== 今日の日付 =====
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');
}

// ===== エスケープ =====
function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ===== 初期化 =====
async function init() {
  loading(true);
  try {
    await Promise.all([loadDepts(), loadStaff()]);
    populateSelects();
    document.getElementById('inp-date').value = todayStr();
    await loadRecords();
    renderRecordList();
  } catch(e) {
    console.error('init error:', e);
    toast('読み込みエラー: ' + e.message, true);
  }
  loading(false);
  updateMonthLabels();
}

// ===== データ読み込み =====
async function loadDepts() {
  departments = await sbGet('lime_spread_departments', 'order=sort_order.asc,id.asc');
}

async function loadStaff() {
  staffList = await sbGet('lime_spread_staff', 'order=sort_order.asc,id.asc');
}

async function loadRecords() {
  // 月の開始・終了日
  const from = `${listYear}-${String(listMonth).padStart(2,'0')}-01`;
  const lastDay = new Date(listYear, listMonth, 0).getDate();
  const to   = `${listYear}-${String(listMonth).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;

  // records と departments を JOIN（Supabase embedded resource）
  const recs = await sbGet(
    'lime_spread_records',
    `record_date=gte.${from}&record_date=lte.${to}&order=record_date.asc,department_id.asc&select=*,departments:lime_spread_departments(id,name)`
  );

  if (!recs.length) { records = []; return; }

  // record_staff と staff を一括取得
  const recIds = recs.map(r => r.id);
  const staffRows = await sbGet(
    'lime_spread_record_staff',
    `record_id=in.(${recIds.join(',')})&select=record_id,staff:lime_spread_staff(id,name)&order=staff_id.asc`
  );

  // staffMapを構築
  const staffMap = {};
  for (const sr of staffRows) {
    if (!staffMap[sr.record_id]) staffMap[sr.record_id] = [];
    staffMap[sr.record_id].push(sr.staff);
  }

  records = recs.map(r => ({
    id:          r.id,
    record_date: r.record_date,
    note:        r.note || '',
    dept_id:     r.departments.id,
    dept_name:   r.departments.name,
    staff_list:  staffMap[r.id] || [],
    staff_ids:   (staffMap[r.id] || []).map(s => s.id)
  }));
}

// ===== セレクト生成（部署用） =====
function buildOptions(sel, items, selected = null) {
  sel.innerHTML = '<option value="">― 選択してください ―</option>';
  items.forEach(it => {
    const opt = document.createElement('option');
    opt.value = it.id;
    opt.textContent = it.name;
    if (selected && String(it.id) === String(selected)) opt.selected = true;
    sel.appendChild(opt);
  });
}

// ===== 実施者行操作 =====
function addStaffRow(containerId, selectedId = '') {
  const container = document.getElementById(containerId);
  const opts = staffList.map(s =>
    `<option value="${s.id}"${String(s.id) === String(selectedId) ? ' selected' : ''}>${escHtml(s.name)}</option>`
  ).join('');
  const row = document.createElement('div');
  row.className = 'staff-row';
  row.innerHTML =
    `<select><option value="">― 選択 ―</option>${opts}</select>` +
    `<button type="button" class="btn-remove-staff" onclick="removeStaffRow(this)" aria-label="削除">×</button>`;
  container.appendChild(row);
}

function removeStaffRow(btn) {
  const container = btn.closest('.staff-rows');
  if (container.querySelectorAll('.staff-row').length <= 1) {
    container.querySelector('select').value = '';
    return;
  }
  btn.closest('.staff-row').remove();
}

function getCheckedStaffIds(containerId) {
  return Array.from(
    document.querySelectorAll(`#${containerId} select`)
  ).map(sel => parseInt(sel.value)).filter(v => v > 0);
}

function buildStaffRows(containerId, selectedIds = []) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  if (!selectedIds.length) {
    addStaffRow(containerId);
  } else {
    selectedIds.forEach(id => addStaffRow(containerId, id));
  }
}

function populateSelects() {
  buildOptions(document.getElementById('inp-dept'),  departments);
  buildOptions(document.getElementById('edit-dept'), departments);
  buildStaffRows('inp-staff-rows');
  buildStaffRows('edit-staff-rows');
}

// ===== 重複チェック（入力フォーム） =====
function checkDup() {
  const date   = document.getElementById('inp-date').value;
  const deptId = document.getElementById('inp-dept').value;
  if (!date || !deptId) { document.getElementById('dup-warning').classList.remove('show'); return; }
  const exists = records.some(r => r.record_date === date && String(r.dept_id) === String(deptId));
  document.getElementById('dup-warning').classList.toggle('show', exists);
}

// ===== 記録保存 =====
document.getElementById('btn-save').addEventListener('click', async () => {
  const date     = document.getElementById('inp-date').value;
  const deptId   = parseInt(document.getElementById('inp-dept').value);
  const staffIds = getCheckedStaffIds('inp-staff-rows');
  const note     = document.getElementById('inp-note').value;

  if (!date || !deptId || !staffIds.length) {
    toast('実施日・担当部署・実施者を選択してください', true); return;
  }

  loading(true);
  try {
    // 重複チェック
    const existing = await sbGet('lime_spread_records', `record_date=eq.${date}&department_id=eq.${deptId}&select=id&limit=1`);
    if (existing.length) {
      pendingDupId = existing[0].id;
      loading(false);
      document.getElementById('dup-modal').classList.add('open');
      return;
    }
    await saveRecord(null, date, deptId, staffIds, note);
    toast('記録しました ✓');
    resetInputForm();
    await loadRecords();
    renderRecordList();
  } catch(e) {
    toast('保存エラー: ' + e.message, true);
  }
  loading(false);
});

function resetInputForm() {
  document.getElementById('inp-date').value = todayStr();
  document.getElementById('inp-dept').value = '';
  buildStaffRows('inp-staff-rows');
  document.getElementById('inp-note').value = '';
  document.getElementById('dup-warning').classList.remove('show');
}

// ===== recordを保存（新規or上書き） =====
async function saveRecord(existingId, date, deptId, staffIds, note) {
  if (existingId) {
    // 更新
    await sbPatch('lime_spread_records', `id=eq.${existingId}`, { record_date: date, department_id: deptId, note });
    await sbDelete('lime_spread_record_staff', `record_id=eq.${existingId}`);
  } else {
    // 新規
    const rows = await sbPost('lime_spread_records', { record_date: date, department_id: deptId, note });
    existingId = rows[0].id;
  }
  // record_staff 一括挿入
  await sbPost('lime_spread_record_staff', staffIds.map(sid => ({ record_id: existingId, staff_id: sid })));
}

// ===== 重複上書き =====
document.getElementById('btn-dup-overwrite').addEventListener('click', async () => {
  document.getElementById('dup-modal').classList.remove('open');
  const date     = document.getElementById('inp-date').value;
  const deptId   = parseInt(document.getElementById('inp-dept').value);
  const staffIds = getCheckedStaffIds('inp-staff-rows');
  const note     = document.getElementById('inp-note').value;

  loading(true);
  try {
    await saveRecord(pendingDupId, date, deptId, staffIds, note);
    toast('上書きしました ✓');
    resetInputForm();
    pendingDupId = null;
    await loadRecords();
    renderRecordList();
  } catch(e) {
    toast('エラーが発生しました', true);
  }
  loading(false);
});
document.getElementById('btn-dup-cancel').addEventListener('click', () => {
  document.getElementById('dup-modal').classList.remove('open');
  pendingDupId = null;
});

// ===== 一覧描画 =====
function renderRecordList() {
  const container = document.getElementById('records-container');
  if (!records.length) {
    container.innerHTML = '<div class="no-records">この月の記録はありません</div>';
    return;
  }
  container.innerHTML = records.map(r => {
    const d   = new Date(r.record_date + 'T00:00:00');
    const day = d.getDate();
    const dow = dowJa[d.getDay()];
    const cls = d.getDay() === 0 ? 'sun' : (d.getDay() === 6 ? 'sat' : '');
    return `<div class="rec-item" onclick="openEdit(${r.id})">
      <div class="rec-date-box">
        <div class="rec-date-day">${day}</div>
        <div class="rec-date-dow ${cls}">${dow}</div>
      </div>
      <div class="rec-body">
        <div class="rec-dept">${escHtml(r.dept_name)}</div>
        <div class="rec-staff">${(r.staff_list||[]).map(s=>escHtml(s.name)).join('・')}</div>
        ${r.note ? `<div class="rec-note">${escHtml(r.note)}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

// ===== 月ナビ =====
function updateMonthLabels() {
  document.getElementById('list-month-label').textContent = monthLabel(listYear, listMonth);
  document.getElementById('exp-month-label').textContent  = monthLabel(expYear, expMonth);
}

document.getElementById('list-prev').addEventListener('click', async () => {
  listMonth--; if (listMonth < 1) { listMonth = 12; listYear--; }
  updateMonthLabels(); loading(true);

});
document.getElementById('list-next').addEventListener('click', async () => {
  listMonth++; if (listMonth > 12) { listMonth = 1; listYear++; }
  updateMonthLabels(); loading(true);
  await loadRecords(); renderRecordList(); loading(false);
});
document.getElementById('exp-prev').addEventListener('click', () => {
  expMonth--; if (expMonth < 1) { expMonth = 12; expYear--; }
  updateMonthLabels();
});
document.getElementById('exp-next').addEventListener('click', () => {
  expMonth++; if (expMonth > 12) { expMonth = 1; expYear++; }
  updateMonthLabels();
});

// ===== 訂正モーダル =====
function openEdit(id) {
  const rec = records.find(r => String(r.id) === String(id));
  if (!rec) return;
  document.getElementById('edit-id').value    = rec.id;
  document.getElementById('edit-date').value  = rec.record_date;
  document.getElementById('edit-note').value  = rec.note || '';
  buildOptions(document.getElementById('edit-dept'), departments, rec.dept_id);
  buildStaffRows('edit-staff-rows', rec.staff_ids || []);
  document.getElementById('edit-modal').classList.add('open');
}
document.getElementById('btn-edit-cancel').addEventListener('click', () => {
  document.getElementById('edit-modal').classList.remove('open');
});

document.getElementById('btn-edit-save').addEventListener('click', async () => {
  const id       = parseInt(document.getElementById('edit-id').value);
  const date     = document.getElementById('edit-date').value;
  const deptId   = parseInt(document.getElementById('edit-dept').value);
  const staffIds = getCheckedStaffIds('edit-staff-rows');
  const note     = document.getElementById('edit-note').value;
  if (!date || !deptId || !staffIds.length) { toast('実施者を1名以上選択してください', true); return; }
  loading(true);
  try {
    await saveRecord(id, date, deptId, staffIds, note);
    document.getElementById('edit-modal').classList.remove('open');
    toast('訂正しました ✓');
    await loadRecords(); renderRecordList();
  } catch(e) { toast('保存エラー: ' + e.message, true); }
  loading(false);
});

document.getElementById('btn-edit-delete').addEventListener('click', async () => {
  if (!confirm('この記録を削除しますか？')) return;

    // record_staff は CASCADE DELETE で自動削除

});

// モーダル外タップで閉じる
document.querySelectorAll('.modal-overlay').forEach(overlay => {

    if (used.length) { toast('記録で使用中のため削除できません', true); loading(false); return; }

    );

// CSV出力（クライアントサイドで生成）
document.getElementById('btn-csv').addEventListener('click', () => {
  exportCsv();
});

async function exportCsv() {
  const cd = document.getElementById('exp-confirm-date').value;
  const cb = document.getElementById('exp-confirm-by').value;
  const label = expYear + '年' + expMonth + '月';

  const from = `${expYear}-${String(expMonth).padStart(2,'0')}-01`;
  const lastDay = new Date(expYear, expMonth, 0).getDate();
  const to = `${expYear}-${String(expMonth).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;

  loading(true);
  try {
    const recs = await sbGet(
      'lime_spread_records',
      `record_date=gte.${from}&record_date=lte.${to}&order=record_date.asc,department_id.asc&select=*,departments:lime_spread_departments(id,name)`
    );

    const staffMap = {};
    if (recs.length) {
      const recIds = recs.map(r => r.id);
      const staffRows = await sbGet(
        'lime_spread_record_staff',
        `record_id=in.(${recIds.join(',')})&select=record_id,staff:lime_spread_staff(id,name)&order=staff_id.asc`
      );
      for (const sr of staffRows) {
        if (!staffMap[sr.record_id]) staffMap[sr.record_id] = [];
        staffMap[sr.record_id].push(sr.staff.name);
      }
    }

    const dowMap = {0:'日',1:'月',2:'火',3:'水',4:'木',5:'金',6:'土'};
    const lines = [];
    const toCsv = (...cols) => cols.map(c => '"' + String(c||'').replace(/"/g,'""') + '"').join(',');

    lines.push(toCsv('石灰散布記録', label));
    lines.push(toCsv('確認日', cd, '確認者', cb));
    lines.push('');
    lines.push(toCsv('日付', '曜日', '担当部署', '実施者', '備考'));
    for (const r of recs) {
      const d = new Date(r.record_date + 'T00:00:00');
      const dow = dowMap[d.getDay()];
      const staffNames = (staffMap[r.id] || []).join('・');
      lines.push(toCsv(r.record_date.replace(/-/g,'/'), dow, r.departments.name, staffNames, r.note||''));
    }
    lines.push('');
    lines.push(toCsv('確認日', cd, '確認者', cb));

    const bom = '\uFEFF';
    const blob = new Blob([bom + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `lime_records_${expYear}${String(expMonth).padStart(2,'0')}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  } catch(e) {
    toast('CSV出力エラー: ' + e.message, true);
  }
  loading(false);
}
